[project]
name = "airec"
version = "0.2.0"
description = "Personal research digest: collect widely, judge against an interest map, write a readable digest."
readme = "README.md"
license = "MIT"
authors = [{ name = "zhezhou1106" }]
keywords = ["research", "arxiv", "llm", "recommender", "digest"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.9",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "markdown-it-py>=3.0",
    "ruamel.yaml>=0.18",
]

[project.urls]
Repository = "https://github.com/zhezhou1106/airec"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rec = "airec.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airec"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
