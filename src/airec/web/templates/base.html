<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}airec{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">📰</span>
          <div>
            <div class="brand-name">{{ title }}</div>
            <div class="brand-note">{{ schedule }}</div>
          </div>
        </div>
        <nav class="segmented" aria-label="Pages">
          <a href="/" {% if page == "report" %}aria-current="page"{% endif %}>This week</a>
          <a href="/directions" {% if page == "directions" %}aria-current="page"{% endif %}>Directions</a>
        </nav>
      </header>
      <main>{% block content %}{% endblock %}</main>
    </div>
  </body>
</html>
